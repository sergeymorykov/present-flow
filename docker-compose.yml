services:
  present-flow:
    # Образ runtime-only: ожидает уже собранный ./dist на хосте.
    # Перед `docker compose build` обязательно: npm ci && npm run build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CPP_COMPILER_URL: ${VITE_CPP_COMPILER_URL:?VITE_CPP_COMPILER_URL is required in .env}
    container_name: present-flow
    image: present-flow:${VERSION:-latest}
    init: true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /tmp:size=8m,uid=101,gid=101
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      - signaling-server
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:5000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 128M
        reservations:
          cpus: '0.2'
          memory: 64M

  signaling-server:
    build:
      context: .
      dockerfile: Dockerfile.signaling
    container_name: signaling-server
    environment:
      PORT: 8089
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M
        reservations:
          cpus: '0.1'
          memory: 32M

  coturn:
    image: coturn/coturn
    container_name: coturn
    restart: always
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
