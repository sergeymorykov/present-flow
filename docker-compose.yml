services:
  present-flow:
    # Образ runtime-only: ожидает уже собранный ./dist на хосте.
    # Перед `docker compose build` обязательно: npm ci && npm run build
    build:
      context: .
      dockerfile: Dockerfile
    container_name: present-flow
    image: present-flow:${VERSION:-latest}
    init: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /tmp:size=8m
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    # Honored by `docker compose up` (v2). `deploy.resources` is only applied in Swarm mode.
    mem_limit: 192m
    mem_reservation: 96m
    memswap_limit: 192m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
