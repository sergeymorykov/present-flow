services:
  present-flow:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CPP_COMPILER_URL: ${VITE_CPP_COMPILER_URL}
    container_name: present-flow
    image: present-flow:${VERSION:-latest}
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      - signaling-server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  signaling-server:
    build:
      context: .
      dockerfile: Dockerfile.signaling
    container_name: signaling-server
    environment:
      PORT: 8089
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"